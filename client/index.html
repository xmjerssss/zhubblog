<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      网易云音乐封面有全站防盗链，no-referrer 可以让封面正常加载。
      副作用是本站对外链接也不再携带来源信息，属于预期的隐私取向取舍。
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fc466b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />

    <!-- 首屏占位，避免 JS 加载期间的空白闪烁；真实标题由 react-helmet 接管 -->
    <title>Rin</title>
    <meta name="description" content="A lightweight personal blogging system" />

    <!--
      站点配置由服务端注入（名称、头像、主题等），必须早于应用脚本执行。
      data-cfasync="false" 让 Cloudflare 的 Rocket Loader 不要延迟它。
    -->
    <script data-cfasync="false" src="/api/config/client/bootstrap.js"></script>

    <!--
      构建产物更新后，旧页面引用的旧 chunk 已被删除，动态 import 会失败。
      这里在应用脚本之前兜底：识别 chunk 加载错误 → 自动整页刷新一次拿到新 HTML，
      15 秒内不重复刷新，避免死循环。必须先于 module 脚本注册。
    -->
    <script data-cfasync="false">
      (function () {
        var KEY = "rin:chunk-recovery-at";
        var CHUNK_ERROR = /dynamically imported module|Importing a module script failed|Loading chunk|error loading dynamically imported module/i;

        function isChunkError(message) {
          return !!message && CHUNK_ERROR.test(String(message));
        }

        function recover(message) {
          if (!isChunkError(message)) return;
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 15000) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {
            return;
          }
          window.location.reload();
        }

        window.addEventListener("vite:preloadError", function (event) {
          recover(event && event.payload && event.payload.message);
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          recover(reason && (reason.message || reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- JS 未加载完成前的首屏骨架，避免纯白屏 -->
      <div class="rin-boot" aria-busy="true">
        <div class="rin-boot__spinner"></div>
      </div>
    </div>
    <style>
      .rin-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .rin-boot__spinner {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        opacity: 0.35;
        animation: rin-boot-spin 0.8s linear infinite;
      }
      @keyframes rin-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rin-boot__spinner {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
